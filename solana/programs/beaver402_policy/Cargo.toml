[package]
name = "beaver402_policy"
version = "0.1.0"
description = "Beaver402 payment policy account for Solana"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "beaver402_policy"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.2.0"
anchor-spl = "1.2.0"
bytemuck = { version = "1", features = ["derive", "min_const_generics"] }
solana-instructions-sysvar = "3.0.0"
solana-sdk-ids = "3.1.0"
solana-sha256-hasher = "3.1.0"

[dev-dependencies]
litesvm = { version = "0.17.0", features = ["precompiles"] }
openssl = { version = "0.10", features = ["vendored"] }
serde_json = "1"
solana-ed25519-program = "3.0.0"
solana-keypair = "3.1.2"
solana-message = "4.2.4"
solana-secp256r1-program = { version = "3.0.0", features = ["openssl-vendored"] }
solana-signer = "3.0.1"
solana-clock = "3.2"
solana-account = "4.3.0"
solana-transaction = "4.1.5"
spl-associated-token-account-interface = "2.0.0"
spl-token-interface = "2.0.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
